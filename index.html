<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>تماس با خانواده سلمان</title>
<style>
:root{--bg:#0b1730;--card:#13264a;--gold:#f0b95a;--text:#f4f1ea;--sub:#8e9bb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 0,#14264a,var(--bg) 70%);color:var(--text);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif}
.card{width:100%;max-width:400px;padding:22px 14px 18px;border-radius:34px;background:linear-gradient(180deg,#14284f,#0e1d3b);border:1.5px solid #2f4268;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(240,185,90,.35)}
.head{position:relative;text-align:center}
.badge{width:84px;height:84px;margin:0 auto;border-radius:50%;border:1.5px solid rgba(240,185,90,.45);background:radial-gradient(circle,#1c2f58,#10213f);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 0 22px rgba(240,185,90,.15)}
.spark{position:absolute;top:26px;color:var(--gold);font-size:20px}
.spark.l{left:12%}.spark.r{right:12%}
h1{margin:12px 0 8px;font-size:38px;font-weight:bold;color:var(--gold)}
p{margin:0;color:var(--sub);font-size:15px;line-height:1.9}
.div{display:flex;align-items:center;gap:8px;margin:14px 20px 16px;color:var(--gold);font-size:12px}
.div:before,.div:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(240,185,90,.5),transparent)}
a.row{display:flex;direction:ltr;align-items:center;gap:14px;margin-top:12px;padding:12px 16px 12px 12px;border-radius:24px;color:#fff;text-decoration:none;border:1.5px solid;transition:transform .1s}
a.row:active{transform:scale(.97)}
.av{flex:none;width:68px;height:68px;border-radius:50%;overflow:hidden;border:3px solid}
.av svg{display:block;width:100%;height:100%}
.sep{flex:none;width:1.5px;align-self:stretch;margin:6px 0;opacity:.5}
.txt{flex:1;display:flex;flex-direction:column;gap:4px;text-align:left}
.who{font-size:22px;font-weight:bold;direction:rtl}
.num{font-size:18px;letter-spacing:.5px}
.chev{flex:none;width:12px;height:12px;border-top:2.5px solid var(--gold);border-right:2.5px solid var(--gold);transform:rotate(45deg);margin-right:8px}
a.row.dad{background:linear-gradient(135deg,#1b3a73,#14305f);border-color:#2f5aa8}
.dad .av{border-color:#3c7ae0;background:linear-gradient(180deg,#c9d9f1,#a9c0e6)}.dad .sep{background:#5b82c7}
a.row.mom{background:linear-gradient(135deg,#1a5c66,#14464f);border-color:#2a8d96}
.mom .av{border-color:#35aeb5;background:linear-gradient(180deg,#b4e4e6,#8fd0d4)}.mom .sep{background:#47b0b5}
a.row.gp{background:linear-gradient(135deg,#8a4a16,#6c380f);border-color:#c0661b}
.gp .av{border-color:#f08a24;background:linear-gradient(180deg,#fcd9ab,#f4bd82)}.gp .sep{background:#e08a3c}
.foot{margin-top:16px;text-align:center;color:var(--sub);font-size:14px}
.foot b{display:block;color:var(--gold);font-size:20px;margin-bottom:2px}
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <span class="spark l">✦</span><span class="spark r">✦</span>
    <div class="badge">🐴</div>
    <h1>سلمان</h1>
    <p>اگر نیاز به تماس با خانواده‌اش بود،<br>لطفاً یکی از شماره‌ها را لمس کنید.</p>
  </div>
  <div class="div">✦</div>

  <a class="row dad" href="tel:+989155522973">
    <span class="av"><svg viewBox="0 0 100 100"><path d="M0 100c0-18 12-26 28-29l22 8 22-8c16 3 28 11 28 29z" fill="#15254a"/><path d="M36 71l14 25 14-25-14 8z" fill="#eef3fb"/><path d="M46 74h8l-2 6 3 18H45l3-18z" fill="#0e1a36"/><rect x="42" y="56" width="16" height="20" rx="7" fill="#3f609b"/><ellipse cx="50" cy="40" rx="19" ry="23" fill="#4a6fb0"/><path d="M31 38C28 18 40 9 51 9c12 0 21 9 18 29-2-8-6-13-11-15-8 4-17 4-25 1-1 5-2 10-2 14z" fill="#15254a"/></svg></span>
    <span class="sep"></span>
    <span class="txt"><span class="who">بابا</span><span class="num">0915 552 2973</span></span>
    <span class="chev"></span>
  </a>

  <a class="row mom" href="tel:+989153550078">
    <span class="av"><svg viewBox="0 0 100 100"><path d="M23 64C16 42 22 15 50 13c28 2 34 29 27 51-2 6-10 4-12-2H35c-2 6-10 8-12 2z" fill="#1b6269"/><path d="M4 100c0-18 12-26 30-29 3 8 9 11 16 11s13-3 16-11c18 3 30 11 30 29z" fill="#1f7f86"/><rect x="43" y="58" width="14" height="18" rx="6" fill="#2f9aa0"/><ellipse cx="50" cy="42" rx="18" ry="22" fill="#3aa5ab"/><path d="M31 42C28 22 39 14 52 14c14 0 21 12 16 28-3-9-8-14-14-17-5 6-14 12-23 17z" fill="#1b6269"/></svg></span>
    <span class="sep"></span>
    <span class="txt"><span class="who">مامان</span><span class="num">0915 355 0078</span></span>
    <span class="chev"></span>
  </a>

  <a class="row gp" href="tel:+989153717208">
    <span class="av"><svg viewBox="0 0 100 100"><path d="M0 100c0-18 12-26 28-29l22 10 22-10c16 3 28 11 28 29z" fill="#6f3810"/><path d="M29 72l21 11-6-14z" fill="#8f4d1a"/><path d="M71 72L50 83l6-14z" fill="#8f4d1a"/><rect x="42" y="56" width="16" height="20" rx="7" fill="#a05a22"/><ellipse cx="30" cy="42" rx="3.5" ry="6" fill="#a85f26"/><ellipse cx="70" cy="42" rx="3.5" ry="6" fill="#a85f26"/><ellipse cx="50" cy="40" rx="19" ry="23" fill="#b56a2e"/><path d="M32 36c-3-10 1-18 9-21-6 7-7 13-7 21zM68 36c3-10-1-18-9-21 6 7 7 13 7 21z" fill="#6f3810"/><path d="M33 52c6-6 13-5 17-1 4-4 11-5 17 1-3 8-11 7-17 4-6 3-14 4-17-4z" fill="#f1e4cf"/></svg></span>
    <span class="sep"></span>
    <span class="txt"><span class="who">پدربزرگ</span><span class="num">0915 371 7208</span></span>
    <span class="chev"></span>
  </a>

  <div class="foot"><b>♥</b>ممنون از مهربانی شما</div>
</main>
</body>
</html>
